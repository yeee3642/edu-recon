# edu-recon configuration. All keys are optional; anything omitted uses the
# built-in default (see edurecon/config.py). Values below mirror the defaults.

# --- global ---
intensity: full          # full | recon | passive
concurrency: 4           # targets scanned in parallel
http_timeout: 12

# --- tool binaries (auto-discovered on PATH if left as a bare name) ---
nmap_bin: nmap
dirsearch_bin: dirsearch
sqlmap_bin: sqlmap
hydra_bin: hydra
subfinder_bin: subfinder
dalfox_bin: dalfox

# --- cloned script tools (populated by: python recon.py setup) ---
# phpcgi_dir: third_party/php-cgi-Injector
# wp2shell_dir: third_party/wp2shell
# phpcgi_python / wp2shell_python / react2shell_python default to the interpreter
# running edu-recon (sys.executable) so bundled Python tools inherit the deps
# installed by `recon.py setup`. Only set these to override with a specific python.
phpcgi_bypass: false      # --bypass is INTERACTIVE (menu prompts) -> unusable headless; keep off

# --- CVE-2025-55182 React Server Components RCE (hidden-investigations/react2shell-scanner) ---
react2shell_enabled: true
react2shell_safe_check: true    # SAFE_CHECK marker payload — no OS command executed
react2shell_command: id         # only used when react2shell_safe_check is false
react2shell_paths: ["/"]        # RSC action paths to probe on each host root
react2shell_waf_bypass: false   # prepend a junk multipart field for WAF evasion
react2shell_vercel_waf_bypass: false
react2shell_insecure: true      # tolerate self-signed certs on internal targets
react2shell_windows: false      # use whoami instead of id when command == id
react2shell_target_timeout: 25

# --- nmap ---
nmap_top_ports: 1000      # set 0 for a full -p- scan
nmap_min_rate: 1500
nmap_vuln_scripts: true   # --script vuln (CVE hints)

# --- subdomain expansion ---
subdomain_enabled: true
subdomain_allow_scope: true   # authorize *.domain for every listed domain
subdomain_use_crtsh: true
subdomain_max: 200

# --- web discovery / crawl ---
web_extensions: php,asp,aspx,jsp,html,txt,zip,tar.gz,sql,bak,json,env,git
web_threads: 25
crawl_max_pages: 40
crawl_max_targets: 40

# --- secrets / API-key leak scanning ---
secret_scan: true
api_doc_probe: true
secrets_max_assets: 60

# --- injection ---
sqlmap_level: 2
sqlmap_risk: 1
sqlmap_crawl: 2
sqlerr_quickpass: true
xss_enabled: true
xss_builtin: true

# --- weak password (hydra) ---
hydra_tasks: 4            # low to avoid account lockout
hydra_stop_on_first: true
hydra_services: [ssh, ftp, rdp, mysql, postgres, vnc, smb, telnet, redis]

# --- scope safety: extra networks authorized beyond the target file ---
extra_allowed_cidrs: []
